<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Older vintages do not rate higher · Cork To Table</title>
  <style>
    @import url('fonts.css');

    :root {
      --burgundy:   #5C1A2E;
      --cream:      #F5ECD7;
      --cream-dark: #EAD9BE;
      --gold:       #B8973A;
      --rose:       #C27A8A;
      --charcoal:   #2C2C2C;
      --mid:        #7A5A64;
      --light:      #B09090;
      --bg:         #FAF6EF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; } body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 28px 12px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--bg);
    }

    /* ── Header ── */
    .header {
      background: var(--burgundy);
      padding: 28px 36px 24px;
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--cream);
      line-height: 1.2;
    }

    /* ── Main ── */
    .main {
      padding: 28px 36px 24px;
    }

    .chart-head {
      font-size: 9px;
      color: var(--light);
      font-style: italic;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .chart-wrap {
      position: relative;
      height: 250px;
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      font-size: 10px;
      color: var(--mid);
    }

    .legend span { display: flex; align-items: center; gap: 7px; }
    .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--cream-dark);
      margin-top: 24px;
      padding-top: 12px;
      font-size: 9.5px;
      color: var(--light);
      font-style: italic;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="title">Older vintages do not rate higher</div>
  </div>

  <div class="main">
    <div class="chart-head">Average rating of the 2015 to 2017 vintages minus the 2020 to 2023 vintages, same wine, on a scale of 5. One dot per wine.</div>

    <div class="chart-wrap">
      <canvas id="vintageChart"></canvas>
    </div>

    <div class="footer">
      Source: Wine rating data obtained from Vivino, October 2026.
    </div>
  </div>

</div>

<script src="chart.umd.min.js"></script>
<script>
  const TIERS = ['Bourgogne (regional)', 'Village and above'];
  const COLOURS = ['#B8973A', '#5C1A2E'];

  // tier index (0 regional, 1 village and above), rating difference older minus newer
  const WINES = [
    [0, -0.300], [0, -0.283], [0, -0.267], [0, -0.200], [0, -0.183],
    [1, -0.167], [0, -0.167], [1, -0.158], [1, -0.133], [1, -0.133],
    [0, -0.100], [1, -0.067], [1, -0.050], [1, -0.050], [1, -0.050],
    [1, -0.033], [1, -0.033], [1, -0.033], [1, -0.025], [1, -0.025],
    [1, -0.017], [1, -0.008], [0, 0.000], [1, 0.033], [1, 0.033],
    [1, 0.033], [1, 0.033], [0, 0.058], [1, 0.067], [1, 0.067],
    [1, 0.133],
  ];

  // Stack wines that share a value so each one stays visible.
  const seen = {};
  const offsets = [0, 0.17, -0.17, 0.34];
  const datasets = TIERS.map((label, t) => ({
    label,
    data: WINES.filter(w => w[0] === t).map(([, d]) => {
      const key = t + ':' + d;
      const k = seen[key] = (seen[key] || 0) + 1;
      return { x: d, y: t + offsets[(k - 1) % 4] };
    }),
    backgroundColor: COLOURS[t],
    borderColor: '#FAF6EF',
    borderWidth: 1.5,
    pointRadius: 6,
  }));

  const higher = WINES.filter(w => w[1] > 0).length;

  // Zero line, direction labels and the headline count.
  const annotations = {
    id: 'annotations',
    beforeDatasetsDraw(c) {
      const { ctx, chartArea: a, scales: { x } } = c;
      const zx = x.getPixelForValue(0);
      ctx.save();
      ctx.fillStyle = 'rgba(92,26,46,0.05)';
      ctx.fillRect(zx, a.top, a.right - zx, a.bottom - a.top);
      ctx.strokeStyle = '#2C2C2C';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(zx, a.top); ctx.lineTo(zx, a.bottom); ctx.stroke();
      ctx.font = "500 10px 'Montserrat', sans-serif";
      ctx.fillStyle = '#7A5A64';
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'right';
      ctx.fillText('← Newer rated higher', zx - 8, a.bottom - 6);
      ctx.textAlign = 'left';
      ctx.fillText('Older rated higher →', zx + 8, a.bottom - 6);
      ctx.textBaseline = 'top';
      ctx.font = "600 12px 'Montserrat', sans-serif";
      ctx.fillStyle = '#2C2C2C';
      ctx.fillText(`Older rated higher in ${higher} of ${WINES.length} wines`, zx + 8, a.top + 6);
      ctx.restore();
    },
  };

  // Chart text is drawn on a canvas, which never asks the browser for a font by itself,
  // so request the brand faces first and draw once they are in.
  Promise.all(['400 11px Montserrat', '500 11px Montserrat', '600 11px Montserrat'].map(f => document.fonts.load(f))).then(() => new Chart(document.getElementById('vintageChart'), {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      events: [],
      layout: { padding: { right: 10 } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: {
          min: -0.35,
          max: 0.25,
          border: { display: false },
          grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
          ticks: {
            stepSize: 0.05,
            font: { family: 'Montserrat', size: 9 },
            color: '#B09090',
            padding: 6,
            callback: (v) => (v > 0 ? '+' : '') + Number(v).toFixed(2).replace('-', '−'),
          },
        },
        y: {
          min: -0.6,
          max: 1.9,
          border: { display: false },
          grid: { display: false },
          afterBuildTicks: (axis) => { axis.ticks = [{ value: 0 }, { value: 1 }]; },
          ticks: { font: { family: 'Montserrat', size: 11, weight: '500' }, color: '#7A5A64', callback: (v) => TIERS[v] },
        },
      },
    },
    plugins: [annotations],
  }));
</script>

</body>
</html>
