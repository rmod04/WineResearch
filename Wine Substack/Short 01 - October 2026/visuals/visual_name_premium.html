<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where the name premium shows up · Cork To Table</title>
  <style>
    @import url('fonts.css');

    :root {
      --burgundy:   #5C1A2E;
      --cream:      #F5ECD7;
      --cream-dark: #EAD9BE;
      --gold:       #B8973A;
      --rose:       #C27A8A;
      --charcoal:   #2C2C2C;
      --mid:        #7A5A64;
      --light:      #B09090;
      --bg:         #FAF6EF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; } body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 28px 12px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--bg);
    }

    /* ── Header ── */
    .header {
      background: var(--burgundy);
      padding: 28px 36px 24px;
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--cream);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 400;
      color: rgba(245,236,215,0.6);
      line-height: 1.6;
      margin-top: 6px;
    }

    /* ── Main ── */
    .main {
      padding: 28px 36px 24px;
    }

    /* ── Toggle ── */
    .toggle-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--cream-dark);
      background: transparent;
      color: var(--mid);
      cursor: pointer;
      transition: all 0.15s;
    }

    .toggle-btn:hover {
      border-color: var(--mid);
      color: var(--charcoal);
    }

    .toggle-btn.active {
      background: var(--burgundy);
      border-color: var(--burgundy);
      color: var(--cream);
    }

    /* ── Chart ── */
    .chart-head {
      font-size: 13px;
      color: var(--mid);
      font-style: italic;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .chart-wrap {
      position: relative;
      height: 290px;
    }

    .hint {
      font-size: 12px;
      color: var(--light);
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid var(--cream-dark);
      margin-top: 24px;
      padding-top: 12px;
      font-size: 11px;
      color: var(--light);
      font-style: italic;
      line-height: 1.5;
    }

    @media (max-width: 540px) {
      .header, .main { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="title">Where the name premium shows up</div>
    <div class="subtitle">Wines rated 4.0 or higher out of 5 on Vivino</div>
  </div>

  <div class="main">

    <p class="hint">Click a button to switch views · hover/tap bars for details</p>

    <div class="toggle-row" id="toggleRow">
      <button class="toggle-btn active" data-view="share" onclick="setView('share')">Share under €50</button>
      <button class="toggle-btn" data-view="median" onclick="setView('median')">Median price</button>
    </div>

    <div class="chart-head" id="chartHead"></div>

    <div class="chart-wrap">
      <canvas id="premiumChart" role="img" aria-label="Bar chart comparing Burgundy with other Pinot Noir and Gamay regions"></canvas>
    </div>

    <table class="sr-only" id="dataTable"></table>

    <div class="footer">
      Source: Wine rating and price data obtained from Vivino, US market, October 2026.
    </div>
  </div>

</div>

<script src="chart.umd.min.js"></script>
<script>
  const BURGUNDY = '#5C1A2E';
  const MUTED = '#D6C4BC';

  // Burgundy village and above always sits last and is the highlighted bar.
  const views = {
    share: {
      head: 'Share of well-rated wines that cost under €50',
      max: 100,
      rows: [
        { label: 'Beaujolais cru',               value: 80,  under: 41, n: 51 },
        { label: 'Willamette Valley Pinot Noir', value: 79,  under: 56, n: 71 },
        { label: 'Central Otago Pinot Noir',     value: 46,  under: 11, n: 24 },
        { label: 'Bourgogne (regional)',         value: 44,  under: 8,  n: 18 },
        { label: 'Burgundy village and above',   value: 3.3, under: 4,  n: 122, highlight: true },
      ],
      fmt: (v) => v + '%',
      tip: (r) => `${r.under} of ${r.n} wines under €50 (${r.value}%)`,
    },
    median: {
      head: 'Median price of wines rated 4.0 to 4.2',
      max: 125,
      rows: [
        { label: 'Willamette Valley Pinot Noir', value: 31,  n: 61,  multiple: '3.4x' },
        { label: 'Beaujolais cru',               value: 40,  n: 51,  multiple: '2.7x' },
        { label: 'Central Otago Pinot Noir',     value: 48,  n: 19,  multiple: '2.2x' },
        { label: 'Bourgogne (regional)',         value: 53,  n: 18,  multiple: '2.0x' },
        { label: 'Burgundy village and above',   value: 107, n: 102, highlight: true },
      ],
      fmt: (v) => '€' + v,
      tip: (r) => `Median €${r.value} across ${r.n} wines`,
    },
  };

  let activeView = 'share';
  let chart;

  // Draws each bar's value just past its end, plus the Burgundy multiple where given.
  const endLabels = {
    id: 'endLabels',
    afterDatasetsDraw(c) {
      const v = views[activeView];
      const meta = c.getDatasetMeta(0);
      const ctx = c.ctx;
      ctx.save();
      ctx.textBaseline = 'middle';
      meta.data.forEach((bar, i) => {
        const r = v.rows[i];
        let x = bar.x + 8;
        ctx.font = "600 13px 'Montserrat', sans-serif";
        ctx.fillStyle = '#2C2C2C';
        const text = v.fmt(r.value);
        ctx.fillText(text, x, bar.y);
        if (r.multiple) {
          x += ctx.measureText(text).width + 8;
          ctx.font = "400 12px 'Montserrat', sans-serif";
          ctx.fillStyle = '#7A5A64';
          ctx.fillText(`Burgundy costs about ${r.multiple} this`, x, bar.y);
        }
      });
      ctx.restore();
    },
  };

  function renderTable(v) {
    const t = document.getElementById('dataTable');
    t.innerHTML = '<caption>' + v.head + '</caption>' +
      v.rows.map(r => `<tr><th>${r.label}</th><td>${v.fmt(r.value)}</td></tr>`).join('');
  }

  function apply(v) {
    chart.data.labels = v.rows.map(r => r.label);
    const ds = chart.data.datasets[0];
    ds.data = v.rows.map(r => r.value);
    ds.backgroundColor = v.rows.map(r => r.highlight ? BURGUNDY : MUTED);
    chart.options.scales.x.max = v.max;
    chart.options.scales.x.ticks.callback = (x) => v.fmt(x);
  }

  function setView(name) {
    activeView = name;
    document.querySelectorAll('.toggle-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.view === name));
    const v = views[name];
    document.getElementById('chartHead').textContent = v.head;
    renderTable(v);
    if (chart) { apply(v); chart.update(); }
  }

  function initChart() {
    const ctx = document.getElementById('premiumChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: [], datasets: [{ data: [], borderRadius: 4, borderSkipped: 'start', barThickness: 26 }] },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 400 },
        layout: { padding: { right: 8 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (item) => '  ' + views[activeView].tip(views[activeView].rows[item.dataIndex]),
            },
            backgroundColor: '#2C2C2C',
            titleFont: { family: 'Montserrat', size: 13, weight: '600' },
            bodyFont: { family: 'Montserrat', size: 12 },
            padding: 10,
            cornerRadius: 1,
            displayColors: false,
          },
        },
        scales: {
          x: {
            beginAtZero: true,
            border: { display: false },
            grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
            ticks: { font: { family: 'Montserrat', size: 11 }, color: '#B09090', padding: 6 },
          },
          y: {
            border: { display: false },
            grid: { display: false },
            ticks: { font: { family: 'Montserrat', size: 13, weight: '500' }, color: '#7A5A64' },
          },
        },
      },
      plugins: [endLabels],
    });
    apply(views[activeView]);
    chart.update();
  }

  setView('share');
  // Chart text is drawn on a canvas, which never asks the browser for a font by itself,
  // so request the brand faces first and draw once they are in.
  Promise.all(['400 11px Montserrat', '500 11px Montserrat', '600 11px Montserrat'].map(f => document.fonts.load(f))).then(initChart);
</script>

<!-- ── Auto-height reporter ──────────────────────────────────────────
     Tells the parent page how tall this visual actually is, so the
     embedding iframe can size itself exactly to the content. -->
<script>
(function () {
  if (window.parent === window) return;
  var last = 0;

  function measure() {
    return Math.ceil(Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.offsetHeight
    ));
  }

  function report(force) {
    var h = measure();
    if (!h) return;
    if (!force && Math.abs(h - last) <= 2) return;
    last = h;
    window.parent.postMessage({ type: 'c2t-visual-height', height: h }, '*');
  }

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'c2t-request-height') report(true);
  });

  window.addEventListener('load', function () { report(true); });
  window.addEventListener('pageshow', function () { report(true); });
  window.addEventListener('resize', function () { report(false); });
  document.addEventListener('DOMContentLoaded', function () { report(true); });
  if (window.ResizeObserver) new ResizeObserver(function () { report(false); }).observe(document.body);
  [100, 400, 900, 1600, 2600].forEach(function (t) { setTimeout(function () { report(true); }, t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { report(true); });
})();
</script>

</body>
</html>
